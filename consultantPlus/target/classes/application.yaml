langchain4j:
  open-ai:
    chat-model:
      base-url: https://ws-qtcjf3o4vkn6aovw.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api-key: ${LANGCHAIN4J_API_KEY}
      model-name: qwen-plus
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: https://ws-qtcjf3o4vkn6aovw.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api-key: ${LANGCHAIN4J_API_KEY}
      model-name: qwen-plus
      log-requests: true
      log-responses: true
    embedding-model:
      base-url: https://ws-qtcjf3o4vkn6aovw.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api-key: ${LANGCHAIN4J_API_KEY}
      model-name: text-embedding-v3
      log-requests: true
      log-responses: true

      #设置每次批处理最大请求条数，向量模型限制每次请求最多计算十条向量
      max-segments-per-batch: 10
  #设置向量数据库端口
  community:
    redis:
      host: localhost
      port: 6380

logging:
  level:
    dev.langchain4j: debug

mybatis:
  configuration:
    map-underscore-to-camel-case: true

spring:
  application:
    name: consultant
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/consultant
    username: root
    password: 123456
